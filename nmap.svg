  <circle cx="32" cy="32" r="18" stroke="#10b981" stroke-width="1.5" stroke-dasharray="3 3" stroke-opacity="0.6"/>
  <circle cx="32" cy="32" r="10" stroke="#10b981" stroke-width="1" stroke-opacity="0.4"/>
