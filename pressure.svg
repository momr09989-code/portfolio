<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Stopwatch / Gauge Body -->
  <circle cx="32" cy="35" r="21" fill="#1b1d28" stroke="#f43f5e" stroke-width="2.2"/>
  <!-- Top Push Button -->
  <rect x="28" y="7" width="8" height="5" rx="1.5" fill="#f43f5e"/>
  <line x1="32" y1="12" x2="32" y2="14" stroke="#f43f5e" stroke-width="2"/>
  <rect x="42" y="12" width="5" height="4" rx="1" transform="rotate(40 42 12)" fill="#c9f76c"/>

  <!-- Dial calibration ticks -->
  <circle cx="32" cy="35" r="16" stroke="#64748b" stroke-width="1" stroke-dasharray="2 6"/>
  <!-- High Intensity Zone (Arc) -->
  <path d="M32 19A16 16 0 0 1 48 35" fill="none" stroke="#f43f5e" stroke-width="3" stroke-linecap="round"/>
  <!-- Speedometer Needle pointing forward under pressure -->
  <line x1="32" y1="35" x2="43" y2="24" stroke="#c9f76c" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="32" cy="35" r="3.5" fill="#c9f76c"/>
</svg>