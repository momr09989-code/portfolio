<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Central Distributed Processing Hub -->
  <circle cx="32" cy="32" r="11" fill="#112936" stroke="#70f0df" stroke-width="2"/>
  <path d="M26 32h12M32 26v12" stroke="#c9f76c" stroke-width="2" stroke-linecap="round"/>
  
  <!-- Outer Satellite Nodes (Hadoop/Spark Distributed Nodes) -->
  <circle cx="14" cy="18" r="6" fill="#0c4a6e" stroke="#38bdf8" stroke-width="2"/>
  <circle cx="50" cy="18" r="6" fill="#0c4a6e" stroke="#38bdf8" stroke-width="2"/>
  <circle cx="14" cy="46" r="6" fill="#3b0764" stroke="#a855f7" stroke-width="2"/>
  <circle cx="50" cy="46" r="6" fill="#451a03" stroke="#f59e0b" stroke-width="2"/>

  <!-- Interconnecting Data Pipelines with Stream pulses -->
  <line x1="19" y1="22" x2="25" y2="27" stroke="#38bdf8" stroke-width="2" stroke-dasharray="2 3"/>
  <line x1="45" y1="22" x2="39" y2="27" stroke="#38bdf8" stroke-width="2" stroke-dasharray="2 3"/>
  <line x1="19" y1="42" x2="25" y2="37" stroke="#a855f7" stroke-width="2" stroke-dasharray="2 3"/>
  <line x1="45" y1="42" x2="39" y2="37" stroke="#f59e0b" stroke-width="2" stroke-dasharray="2 3"/>

  <!-- Top streaming arrow -->
  <path d="M24 10h16a3 3 0 0 1 3 3" stroke="#c9f76c" stroke-width="1.8" stroke-linecap="round"/>
</svg>